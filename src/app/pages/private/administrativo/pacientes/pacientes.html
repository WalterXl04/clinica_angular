<main class="container p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 border-start border-4 border-success ps-2">Pacientes</h2> 
        
        <a routerLink="/sistema/admin/pacientes/novo" class="btn btn-success text-white fw-bold">
            Novo Paciente
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light border-bottom">
                        <tr>
                            <th class="ps-4 py-3">Nome</th>
                            <th>CPF</th>
                            <th>Convênio</th>
                            <th>Telefone</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let p of pacientes">
                            <td class="ps-4 fw-bold">{{ p.nome }}</td>
                            <td>{{ p.cpf }}</td>
                            <td>
                                <span class="badge" 
                                      [ngClass]="p.convenio === 'Particular' ? 'bg-warning text-dark' : 'bg-primary'">
                                    {{ p.convenio }}
                                </span>
                            </td>
                            <td>{{ p.telefone }}</td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-primary me-2" (click)="editar(p)">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" (click)="excluir(p)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
