<main class="container p-4">
    
    <h2 class="h3 mb-4 border-start border-4 border-success ps-2">
        {{ isEdicao ? 'Editar Paciente' : 'Cadastrar Novo Paciente' }}
    </h2>
    
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            
            <div *ngIf="showSuccessMessage" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>Sucesso!</strong> Paciente salvo corretamente.
            </div>
            
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                
                <h5 class="text-secondary mb-4">Dados Pessoais</h5>
                <hr class="mb-4">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nome Completo</label>
                        <input type="text" class="form-control" formControlName="nome"
                               [ngClass]="{ 'is-invalid': isSubmitted && f['nome'].errors }">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">CPF</label>
                        <input type="text" class="form-control" formControlName="cpf" placeholder="000.000.000-00"
                               [ngClass]="{ 'is-invalid': isSubmitted && f['cpf'].errors }">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Data de Nascimento</label>
                        <input type="date" class="form-control" formControlName="dataNascimento"
                               [ngClass]="{ 'is-invalid': isSubmitted && f['dataNascimento'].errors }">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Telefone</label>
                        <input type="text" class="form-control" formControlName="telefone"
                               [ngClass]="{ 'is-invalid': isSubmitted && f['telefone'].errors }">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Convênio</label>
                        <select class="form-select" formControlName="convenio"
                                [ngClass]="{ 'is-invalid': isSubmitted && f['convenio'].errors }">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Particular">Particular</option>
                            <option value="Unimed">Unimed</option>
                            <option value="Bradesco Saúde">Bradesco Saúde</option>
                            <option value="Amil">Amil</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">E-mail</label>
                        <input type="email" class="form-control" formControlName="email"
                               [ngClass]="{ 'is-invalid': isSubmitted && f['email'].errors }">
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <a routerLink="/sistema/admin/pacientes" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-success px-4">Salvar</button>
                </div>

            </form>
        </div>
    </div>
</main>
