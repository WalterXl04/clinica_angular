<main class="container p-4">
    
    <h2 class="h3 mb-4 border-start border-4 border-dark ps-2">
        {{ isEdicao ? 'Editar Agendamento' : 'Nova Consulta' }}
    </h2>
    
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            
            <div *ngIf="showSuccessMessage" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>Sucesso!</strong> Agendamento salvo.
            </div>
            
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                
                <h5 class="text-secondary mb-4">Detalhes do Agendamento</h5>
                <hr class="mb-4">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Paciente</label>
                        <select class="form-select" formControlName="paciente"
                                [ngClass]="{ 'is-invalid': isSubmitted && f['paciente'].errors }">
                            <option value="" disabled selected>Selecione o Paciente...</option>
                            <option value="Maria da Silva">Maria da Silva</option>
                            <option value="João Santos">João Santos</option>
                            <option value="Fernanda Oliveira">Fernanda Oliveira</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Médico</label>
                        <select class="form-select" formControlName="medico"
                                [ngClass]="{ 'is-invalid': isSubmitted && f['medico'].errors }">
                            <option value="" disabled selected>Selecione o Médico...</option>
                            <option value="Dr. Roberto Nunes">Dr. Roberto Nunes</option>
                            <option value="Dra. Ana Souza">Dra. Ana Souza</option>
                            <option value="Dr. Carlos Silva">Dr. Carlos Silva</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Data</label>
                        <input type="date" class="form-control" formControlName="data"
                               [ngClass]="{ 'is-invalid': isSubmitted && f['data'].errors }">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Horário</label>
                        <input type="time" class="form-control" formControlName="hora"
                               [ngClass]="{ 'is-invalid': isSubmitted && f['hora'].errors }">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Tipo</label>
                        <select class="form-select" formControlName="tipo"
                                [ngClass]="{ 'is-invalid': isSubmitted && f['tipo'].errors }">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Consulta">Consulta</option>
                            <option value="Retorno">Retorno</option>
                            <option value="Exame">Exame</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Status</label>
                        <select class="form-select" formControlName="status">
                            <option value="Agendado">Agendado</option>
                            <option value="Concluído">Concluído</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold">Observações</label>
                        <textarea class="form-control" rows="3" formControlName="observacoes"></textarea>
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <a routerLink="/sistema/consultas" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary fw-bold px-4">Salvar Agendamento</button>
                </div>

            </form>
        </div>
    </div>
</main>
