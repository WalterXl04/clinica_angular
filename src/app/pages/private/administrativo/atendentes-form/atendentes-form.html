<main class="container p-4">
    
    <h2 class="h3 mb-4 border-start border-4 border-primary ps-2">
        {{ isEdicao ? 'Editar Atendente' : 'Cadastrar Novo Atendente' }}
    </h2>
    
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            
            <div *ngIf="showSuccessMessage" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>Sucesso!</strong> Atendente salvo corretamente.
            </div>
            
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                
                <h5 class="text-secondary mb-4">Dados do Funcionário</h5>
                <hr class="mb-4">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nome Completo</label>
                        <input type="text" class="form-control" formControlName="nome"
                               [ngClass]="{ 'is-invalid': isSubmitted && f['nome'].errors }">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">CPF</label>
                        <input type="text" class="form-control" formControlName="cpf" placeholder="000.000.000-00"
                               [ngClass]="{ 'is-invalid': isSubmitted && f['cpf'].errors }">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Setor</label>
                        <select class="form-select" formControlName="setor"
                                [ngClass]="{ 'is-invalid': isSubmitted && f['setor'].errors }">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Recepção Térreo">Recepção Térreo</option>
                            <option value="Recepção Consultórios">Recepção Consultórios</option>
                            <option value="Call Center">Call Center</option>
                            <option value="Administrativo">Administrativo</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Turno</label>
                        <select class="form-select" formControlName="turno"
                                [ngClass]="{ 'is-invalid': isSubmitted && f['turno'].errors }">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Manhã">Manhã</option>
                            <option value="Tarde">Tarde</option>
                            <option value="Noite">Noite</option>
                            <option value="Integral">Integral</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">Telefone</label>
                        <input type="text" class="form-control" formControlName="telefone"
                               [ngClass]="{ 'is-invalid': isSubmitted && f['telefone'].errors }">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold">E-mail</label>
                        <input type="email" class="form-control" formControlName="email"
                               [ngClass]="{ 'is-invalid': isSubmitted && f['email'].errors }">
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <a routerLink="/sistema/atendentes" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary fw-bold px-4">Salvar</button>
                </div>

            </form>
        </div>
    </div>
</main>
