<main class="container p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 border-start border-4 border-dark ps-2">Agendamento de Consultas</h2> 
        
        <a routerLink="/sistema/consultas/novo" class="btn btn-primary text-white fw-bold">
            Nova Consulta
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light border-bottom">
                        <tr>
                            <th class="ps-4 py-3">Data/Hora</th>
                            <th>Paciente</th>
                            <th>Médico</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let c of consultas">
                            <td class="ps-4">
                                <div class="fw-bold">{{ c.data }}</div>
                                <small class="text-muted">{{ c.hora }}</small>
                            </td>
                            <td class="fw-bold">{{ c.paciente }}</td>
                            <td>{{ c.medico }}</td>
                            <td>
                                <span [class]="getCorStatus(c.status)">{{ c.status }}</span>
                            </td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-primary me-2" (click)="editar(c)" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" (click)="excluir(c)" title="Cancelar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
